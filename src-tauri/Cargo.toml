[package]
name = "watson"
version = "1.5.1"
description = "A cross-platform productivity launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "watson_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"
toml = "0.8"
directories = "5.0"
fuzzy-matcher = "0.3"
urlencoding = "2.1"
open = "5.0"
arboard = "3.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
dirs = "5.0"
meval = "0.2"
regex = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
# UI Automation for browser tab enumeration. Only needed on Windows;
# the target.cfg gate keeps macOS / Linux builds slim.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# X11 client for window enumeration + focus on X11 sessions. Default
# features include the pure-Rust `rust_connection` so we don't pick up
# a libxcb build-time dependency. Wayland support (wlr-foreign-
# toplevel) is a follow-up issue; in the meantime the runtime falls
# back to an explanatory error on Wayland sessions.
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"
